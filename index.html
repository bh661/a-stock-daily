 ["【近5日分时单分钟>1亿】", "腾讯分时 day/query num=5（返回5天，倒序，data[0]=今天）。每条记录为「时间 价格 累计成交量 累计成交额」，逐条做差才是每分钟成交额，每天开盘把累计基准重置为0（故首条 0930 的集合竞价金额被正确计入，未跳过）。命中 32 只。另输出最大单分钟成交额(亿元)、5日内超1亿的分钟数、最大分钟时点(MMDD-HHMM)。"], ["【§3.6 0930七列 — 数据源】", "东财当日逐笔成交明细 stock/details/get（pos=-100000 取全天）。每条为「时间,成交价,成交量(手),笔数,bs」，bs：1=主卖、2=主买、4=集合竞价。该接口只保留最近一个交易日，无法隔日回溯，故必须当日运行一次取完。本次 65 只（筛选结果37 + 涨停32，去重后65）全部取数成功，失败清单为空。"], ["【0930七列 — 分桶规则】", "① 09:15:00–09:24:5x 的 bs=4 记录是集合竞价阶段的虚拟撮合量（累计值、非成交），全部丢弃；② 09:25:00 那条若 bs 已为 1/2 则是真正的集合竞价成交，计入0930桶；③ 09:25:00 与 09:30:00–09:30:59 的逐笔归入 0930 桶，其余按 HH:MM 归入各自分钟桶；④ 每桶累计主买量B(手)、主卖量S(手)及主买额、主卖额（金额=成交价×成交量(手)×100，元）；⑤ 净量＝B−S，净额＝主买额−主卖额。"], ["【0930七列 — 列定义】", "0930方向：净量>0填「主买」、<0填「主卖」、=0填「平」。0930净量(手)/0930净额(万元)：取绝对值。★盘中反向超越：0930为主卖时在09:31之后各分钟桶找主买净量、0930为主买时找主卖净量，只要存在任一分钟的反向净量 > 0930净量即打✓。反向超越最大时点/净量/净额：反向净量最大的那一分钟（即使未超过0930也照常输出，便于看出差距）；全天无反向分钟则填 -。比较用净量(手)，净额仅作参考同时输出。方向为「平」时★列留空、反向三列填 -（本次无「平」）。"], ["【0930 校验结果 — 重要口径说明】", "与腾讯分时逐只对照后确认三点，37只全部可解释、0只不明：① 腾讯分时的分钟标签是「分钟末」，其首条 0930 只含集合竞价，第二条 0931 的累计量才等于「集合竞价+09:30整分钟」，故可比对象是腾讯 0931 累计量而非 0930；② 深市23只精确吻合（如亿纬锂能 0930桶总量 27,855手 = 腾讯0931累计 27,855手，分毫不差）；③ 沪市（含科创板）14只的逐笔流里集合竞价只以 bs=4 虚拟撮合快照出现、没有带买卖方向的 09:25 成交记录，故其0930桶只含09:30整分钟的连续竞价，差额恰等于腾讯首条的集合竞价量（如中国石化 93,200 + 40,515 = 133,715，完全吻合）。结论：沪市个股的集合竞价在东财逐笔中无买卖方向可归属，不计入0930桶，这是数据源限制而非算法误差。"], ["【0930 校验 — 单位与自洽】", "科创板个股腾讯分时的成交量单位是「股」而非「手」（实测比值精确为100.000），已按÷100折算后比对；东财逐笔明细的成交量对各板块一律为「手」（实测比值1.000/1.001），故0930净量(手)口径统一。★盘中反向超越与数值自洽性全量复核：打✓的行均满足 反向净量 > 0930净量，留空的行均不满足，不一致 0 例。"], ["【0930 两页一致性】", "同时出现在筛选结果页与涨停页的 4 只（600261 阳光照明、601188 龙江交通、601599 浙文影业、002086 东方海洋）经逐项比对，0930七列完全一致（两页复用同一个逐笔归约函数与同一份结果对象）。"], ["【主力资金流向 — Sheet1】", "东财 ulist.np 批量接口。f62=当日主力净额(元)、f184=当日净占比%、f164=近5日主力净额、f165=5日净占比%、f174=近10日主力净额、f100=东财行业板块（用于「行业板块」列）。均换算为亿元。本次 37/37 全部取到，无 null、无需等待重试。抽查5只核对「净占比 ≈ 净额 ÷ 成交额」：f184 与 f62/f6×100 完全一致（如 300014 −3.52 vs −3.52）。"], ["【当日新进成交量前50榜】", "取当日全市场成交量前500只（分5页），用腾讯 fqkline 按日期精确匹配上一交易日(2026-11-05)那一行的成交量（数组第6个值，单位手）算出上一交易日前50名单；当日前50中不在上一交易日前50的即为新进入 document.getElementById('d').textContent = R.date || '—';
document.getElementById('v').textContent = R.version || '收盘快报';
document.getElementById('g').textContent = R.generated || '—';
if(R.xlsx) document.getElementById('dl').style.display = 'inline-block';

const body = document.getElementById('body'), nav = document.getElementById('nav');
if(!R.sheets || !R.sheets.length){
  const e = el('div','empty');
  e.innerHTML = '<h2>暂无数据</h2><p>'+(R.message||'等待下一个交易日收盘后的自动更新。')+'</p>';
  body.appendChild(e);
}else{
  const panes = R.sheets.map((s,i)=>{
    const b = el('button'); b.textContent = s.name; b.onclick = ()=>show(i);
    nav.appendChild(b);
    const p = el('div'); p.style.display='none'; p.appendChild(build(s)); body.appendChild(p);
    return p;
  });
  function show(i){
    panes.forEach((p,j)=>p.style.display = i===j?'':'none');
    [...nav.children].forEach((b,j)=>b.classList.toggle('on', i===j));
  }
  show(0);
}

function build(s){
  const box = el('div');
  const bar = el('div','bar');
  const inp = el('input'); inp.type='search'; inp.placeholder='搜索代码 / 名称 / 行业…';
  const cnt = el('span','n');
  bar.appendChild(inp); bar.appendChild(cnt); box.appendChild(bar);

  const wrap = el('div','wrap'), tb = el('table');
  const thead = el('thead'), htr = el('tr');
  const isDesc = /说明/.test(s.name);
  const frozen = isDesc ? 0 : 2;
  let left = 0;
  s.cols.forEach((c,i)=>{
    const th = el('th'); th.textContent = c;
    const w = Math.max(56, Math.min(s.widths[i]||90, 420));
    th.style.minWidth = w+'px'; th.style.width = w+'px';
    if(i<frozen){ th.className='f'+i; th.style.left = left+'px'; left += w; }
    th.onclick = ()=>sort(i, th);
    const ar = el('span','ar'); ar.textContent='⇅'; th.appendChild(ar);
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el('tbody'); if(isDesc) tbody.className='desc';
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  const numish = s.cols.map(c=>/%|额|价|MA|线|量|数|名次|市值|净|率|手|元/.test(c) && !/方向|时点|名称|板块|区间|报告期|股东|说明|代码|池/.test(c));
  let data = s.rows.map((r,i)=>({r, st:(s.cs&&s.cs[i])||[]}));
  let order = null, asc = true;

  function css(id){
    if(!id) return '';
    const st = s.styles[id-1]; if(!st) return '';
    let o = '';
    if(st.bg) o += 'background:'+st.bg+';';
    if(st.fc) o += 'color:'+st.fc+';';
    if(st.b) o += 'font-weight:700;';
    if(st.a==='center') o += 'text-align:center;';
    if(st.a==='right') o += 'text-align:right;';
    return o;
  }
  function render(){
    const q = inp.value.trim().toLowerCase();
    let rows = data;
    if(q) rows = rows.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(q)));
    if(order!==null){
      const k = order;
      rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
</script>
</body>
</html>
