应北京时间 2026-10-28 15:34 的收盘快照。"], ["本次实际运行时刻", "2026-10-29 01:3x（北京时间）。说明：本任务原定于 2026-10-28 15:10（北京）运行，但当时东方财富行情接口 /api/qt/ 全线返回 502，按规则未出表；此后用户多次要求重试，直至东财恢复才完成取数，故运行时刻晚于基准交易日收盘约 10 小时。10-28 为正常交易日且数据已定稿，报表内容仍为 10-28 收盘数据，不受运行时刻影响。"], ["⚠ 本次重大技术回退：候选池改用新浪排行接口", "东方财富的排行/选股接口 api/qt/clist/get 本次全程 502 不可用（在 push2、push2delay、1./2./7./13./23./82.push2、push2delay1、pushdelay 等宿主上共重试 21 次以上均失败；同源请求确认为服务端 502，非本地网络、非 CORS）。而同域的 ulist.np（行情+资金流）、stock/details（逐笔）、push2his（资金流历史）、push2ex（涨停池）、datacenter-web（股东）均正常。因此候选池与全市场排名改用新浪 Market_Center.getHQNodeData 接口（节点 hs_a 全市场按成交量/成交额降序、cyb 创业板、kcb 科创板、hs_bjs 北交所）替代 clist，其余环节口径不变。"], ["新浪替代口径的验证结果", "对候选池全部 96 只个股，逐只将新浪的成交量(股)/2 换算后与东财 ulist.np 的 f5(手)、成交额 f6、最新价 f2 比对，96/96 完全一致、零差异（例：000725 京东方Ａ 新浪 598,903,964 股 = 东财 5,989,040 手；成交额 28.81 亿元两侧相同）。流通股本 f39、行业板块 f100、资金流 f62/f184/f164/f165/f174 仍全部取自东财 ulist.np。"], ["北交所覆盖性检查", "新浪 hs_a 节点不含北交所。经单独查询 hs_bjs 节点，北交所当日成交量最大个股为 29,831,173 股（约 298,312 手），低于全市场量前500门槛 42,384,197 股，故无任何北交所个股进入成交量前500，RANK500 与 A池 不受 hs_a 不含北交所的影响。涨停专页的 2 只北交所个股照常收录。"], ["候选池（并集）", "A池：沪深京A股按成交量 f5 降序前50，且成交额 f6 > 10亿元 → 26 只（另有 24 只仅靠成交量入选但成交额不足10亿，见 Sheet2）。B池：创业板+科创板按成交额降序，取 f6 > 18亿元 全部 → 75 只。候选池 = A ∪ B = 96 只（其中 5 只同时属于 A、B）。"], ["均线条件（三条同时满足）", "最新收盘价 > MA5（近5日收盘均值）、> MA10（近10日收盘均值）、> 5周线（按ISO周分组取每周最后一个交易日收盘价，再取最近5个周收盘的均值）。96 只候选中 34 只通过。"], ["当日K线统一重建", "日K取同花顺全历史前复权 all.js。无论末根日期是否为当日，一律丢弃同花顺的当日 bar（本次 96/96 候选股与 72/72 涨停股的末根均已是 20261028，全部丢弃），再用东财当日行情重建：收盘 f2、最高 f15、最低 f16、开盘 f17、成交量 f5×100（手→股）。"], ["当日bar重建的校验结果", "重建前逐只校验「同花顺去掉当日bar后的末根收盘价 ≈ 东财当日昨收 f18」（容差 0.5%）：候选池 96/96 通过，涨停池 72/72 通过，无一例失败，无除权导致的口径分歧。"], ["次新股排除", "日K不足10根或不足5个ISO周的个股一律排除（MA10 与 5周线分母固定为10/5会虚低造成假通过）。本次排除 1 只：301660 粤芯半导（仅 12 个交易日 / 3 个ISO周，不足5周）。"], ["新高（用当日最高价 f15 对比前复权历史最高价）", "历史新高＝当日最高价为上市以来最高；年内新高＝近252个交易日最高；60日新高＝近60个交易日最高。距历史高点% ＝ 收盘价/历史最高价 − 1。本次命中：历史新高 0 只、年内新高 2 只、60日新高 8 只。"], ["5周内单日换手率>30%", "近25个交易日中任意一日，当日成交量(股) ÷ f39(流通股本) × 100 > 30。同时输出这25日的最大单日换手率。本次命中 5 只。"], ["近5日分时单分钟成交额>1亿元", "腾讯分时 day/query（num=5，返回5天且倒序，data[0]为当日）。每条形如「0931 8.22 121039 102177142.96」＝时间/价格/累计成交量(手)/累计成交额(元)，为累计值，逐条做差才是每分钟成交额；每天开盘把累计基准重置为0，故首条0930的集合竞价金额被完整计入、未跳过。输出是否有超1亿的分钟、最大单分钟成交额、5日内超1亿的分钟数、最大分钟时点(MMDD-HHMM)。本次命中 21 只。"], ["★当日新进成交量前50榜", "取当日全市场成交量前500只，用腾讯 fqkline 按日期精确匹配上一交易日（2026-10-27）那一行的成交量（元素第6个值，单位手），据此算出上一交易日的前50名单；当日前50中不在上一交易日前50的即为新进入。500 只中 499 只取到（上一交易日前50门槛 1,634,274 手）；600621 在 2026-10-27 停牌，腾讯与同花顺均无该日bar，按缺失处理，不影响前50判定。当日前50中共 17 只为新进入，其中进入 Sheet1 的有 2 只。"], ["主力资金流向", "东财 ulist.np 批量接口：f62 当日主力净额(元)、f184 当日净占比%、f164 近5日主力净额、f165 5日净占比%、f174 近10日主力净额、f100 行业板块。均换算为亿元。校验：抽查5只，f184 与 f62/f6×100 完全相等（12.61/0.99/1.11/0.70/0.07）。"], ["§3.6 开盘首笔（0930分钟）主买/主卖标注", "数据源：东财当日逐笔成交明细 stock/details/get（pos=-100000 取全天）。每条形如「09:30:03,5.26,38789,1573,2」＝时间,成交价,成交量(手),笔数,bs；bs：1=主卖、2=主买、4=集合竞价。规则：(1) 09:15:00–09:24:5x 之间 bs=4 的记录是集合竞价阶段的虚拟撮合量、不是成交，全部丢弃；(2) 09:25:00 那条是真正的集合竞价成交（bs 已是1或2），计入0930桶；(3) 09:25:00 以及 09:30:00–09:30:59 的所有逐笔归入 0930 桶，其余按 HH:MM 归入各自分钟桶；(4) 每桶累计主买量B(手)、主卖量S(手)及主买额、主卖额（金额＝成交价×成交量×100）；(5) 净量＝B−S，净额＝主买额−主卖额。0930方向按净量正负。★盘中反向超越：0930为主卖则在09:31之后各分钟桶找主买净量，0930为主买则找主卖净量，只要存在任一分钟的反向净量 > 0930净量即打✓。比较用净量(手)，净额仅作参考同时输出。"], ["§3.6 的一处口径细化（已验证）", "本次逐笔数据中存在 15:00 之后的记录（如 000725 末条 15:29:45，属盘后固定价格交易），这类成交不属于盘中分钟，若计入会在★盘中反向超越中产生伪命中，故分钟桶统一截至 15:00，15:00 之后的逐笔不参与分钟桶与反向超越比较（不影响0930桶）。"], ["§6.2 0930 校验：与腾讯分时的正确比对基准", "规格原文要求「腾讯分时首条0930的累计成交量 ≈ 0930桶总成交量」，实测发现腾讯首条0930仅含09:25集合竞价、不含09:30连续竞价：300006 腾讯 0930=20,615手（成交均价 8.50 恰为开盘价，即纯集合竞价），0931=100,424手（即09:30:00–09:30:59）。本报表0930桶＝集合竞价+09:30分钟，故正确基准是腾讯累计至0931：300006 为 121,039 手，与逐笔算得的 0930桶 37,973(主买)+83,066(主卖)=121,039 手精确相等，校验通过。该差异属腾讯分时的分钟标注方式，非本报表口径错误。"], ["⚠ 逐笔明细取数失败的个股（涨停页0930七列留空）", "东财 stock/details/get 在本次取数后段再次转入 502，且持续约 30 分钟未恢复（后台慢速续跑器重试 13 轮共数百次请求，全部 502）。该接口只保留最近一个交易日的数据、无法隔日回溯，故涨停专页中 69 只个股的 0930 七列留空（填 - ）。Sheet1 的 34 只已在接口可用窗口内全部取到；同时出现在两页的 3 只（300006、300291、300806）在涨停页也有完整0930数据。留空的 69 只代码：001219,002636,002708,301488,603006,603897,601956,603612,003028,600078,002164,000678,301359,300613,002526,603667,603081,6 function build(s){
  const box = el('div');
  const bar = el('div','bar');
  const inp = el('input'); inp.type='search'; inp.placeholder='搜索代码 / 名称 / 行业…';
  const cnt = el('span','n');
  bar.appendChild(inp); bar.appendChild(cnt); box.appendChild(bar);

  const wrap = el('div','wrap'), tb = el('table');
  const thead = el('thead'), htr = el('tr');
  const isDesc = /说明/.test(s.name);
  const frozen = isDesc ? 0 : 2;
  let left = 0;
  s.cols.forEach((c,i)=>{
    const th = el('th'); th.textContent = c;
    const w = Math.max(56, Math.min(s.widths[i]||90, 420));
    th.style.minWidth = w+'px'; th.style.width = w+'px';
    if(i<frozen){ th.className='f'+i; th.style.left = left+'px'; left += w; }
    th.onclick = ()=>sort(i, th);
    const ar = el('span','ar'); ar.textContent='⇅'; th.appendChild(ar);
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el('tbody'); if(isDesc) tbody.className='desc';
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  const numish = s.cols.map(c=>/%|额|价|MA|线|量|数|名次|市值|净|率|手|元/.test(c) && !/方向|时点|名称|板块|区间|报告期|股东|说明|代码|池/.test(c));
  let data = s.rows.map((r,i)=>({r, st:(s.cs&&s.cs[i])||[]}));
  let order = null, asc = true;

  function css(id){
    if(!id) return '';
    const st = s.styles[id-1]; if(!st) return '';
    let o = '';
    if(st.bg) o += 'background:'+st.bg+';';
    if(st.fc) o += 'color:'+st.fc+';';
    if(st.b) o += 'font-weight:700;';
    if(st.a==='center') o += 'text-align:center;';
    if(st.a==='right') o += 'text-align:right;';
    return o;
  }
  function render(){
    const q = inp.value.trim().toLowerCase();
    let rows = data;
    if(q) rows = rows.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(q)));
    if(order!==null){
      const k = order;
      rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
