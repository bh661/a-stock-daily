 120, 90, 90, 120, 112, 105, 120, 135, 112, 120, 120, 120, 105, 105, 112, 90, 90, 172, 120, 127, 157, 82, 112, 135, 150, 150, 165, 150, 165, 120, 127, 120, 285, 210, 285, 255]}, {"name": "筛选说明", "cols": ["项目", "说明"], "rows": [["基准交易日（北京）", "2026-10-19（星期一）。取自东方财富 clist 行情时间戳 f124=1792394415，换算北京时间 2026-10-19 15:20:15，北京日期与运行时刻一致，确认为交易日。"], ["本次实际运行时刻", "2026-10-19 15:20（北京）／2026-10-19 07:19 UTC／美东 EDT 03:19。本任务 cron 按美东时区设定，当日落在 A 股收盘（15:00）之后 20 分钟，收盘行情、涨停池与资金流向均已定稿。"], ["报表版本", "收盘快报版。大宗交易明细与龙虎榜数据当日 18:00 后才发布，本表不含这两项，见同日 18:00 的「a-stock-daily-screen-full」完整版报表。"], ["候选池口径", "A池=沪深京A股按成交量 f5 降序前50 且成交额 f6>10亿元；B池=创业板(m:0+t:80)+科创板(m:1+t:23)按成交额 f6 降序取 f6>18亿元全部；候选池=A∪B。本次 A池27只、B池47只、并集72只（2只同时入选，标注为 A+B）。"], ["均线筛选条件", "三条同时满足：最新收盘价 > MA5（近5日收盘均值）、> MA10（近10日收盘均值）、> 5周线（按ISO周分组取每周最后一个交易日收盘价，再取最近5个周收盘均值）。本次 72 只候选中 16 只通过。"], ["当日K线重建", "同花顺前复权日K（/v6/line/hs_{code}/01/all.js）为基础，统一丢弃同花顺的当日 bar（本次取数时点 15:20，同花顺 all.js 末根普遍仍为 2026-10-16，故实际无需丢弃），再用东财当日行情补一根：收盘 f2、最高 f15、最低 f16、开盘 f17、成交量 f5×100（手→股）。"], ["K线校验通过率", "补当日 bar 前逐只校验「同花顺（去当日bar后）末根收盘价 ≈ 东财今日昨收 f18」，容差 1.5%。筛选结果页 72/72 通过（100%），涨停页 46/46 通过（100%），无除权类异常。"], ["次新股排除清单", "日K不足10根或不足5个ISO周的个股一律排除出筛选结果（MA10 与 5周线分母固定为10/5 会造成虚低假通过）。本次排除 1 只：301660 C粤芯-U，实际交易日数 5 天、ISO周数 2 周，样本期不足无法有效计算 MA10 与 5周线。"], ["新高定义", "用当日最高价 f15 对比前复权历史最高价。★历史新高=当日最高价为上市以来最高；★年内新高=近252个交易日最高；★60日新高=近60个交易日最高；距历史高点% = 收盘价 ÷ 历史最高价 − 1。"], ["换手率>30%定义", "近25个交易日（约5周）中任意一日，当日成交量(股) ÷ f39(流通股本) × 100 > 30 即打✓，并输出该25日的最大单日换手率。"], ["分时单分钟成交额定义", "腾讯分时接口 day/query（num=5，返回倒序5天）。每条形如「0931 价格 累计量 累计额」，逐条做差才是每分钟成交额，每天开盘把累计基准重置为 0，故首条 0930 的集合竞价金额被完整计入。输出：是否存在超1亿的分钟、最大单分钟成交额（亿元）、5日内超1亿的分钟数、最大分钟出现时点（MMDD-HHMM）。"], ["§3.6 0930七列——数据源", "东方财富当日逐笔成交明细 stock/details/get（pos=-100000 取全天）。返回每条形如「09:30:03,5.26,38789,1573,2」=时间,成交价,成交量(手),笔数,bs；bs：1=主卖、2=主买、4=集合竞价。该接口只保留最近一个交易日的数据，无法隔日回溯，因此 0930 标注必须在当日这一次运行里取完。"], ["§3.6 0930七列——分桶规则", "(1) 09:15:00–09:24:5x 之间 bs=4 的记录是集合竞价阶段的虚拟撮合量、不是成交，全部丢弃；(2) 09:25:00 那一条是真正的集合竞价成交（bs 已是1或2），计入 0930 桶；(3) 09:25:00 以及 09:30:00–09:30:59 的所有逐笔归入 0930 桶，其余逐笔按 HH:MM 归入各自分钟桶。"], ["§3.6 0930七列——算法", "每个分钟桶分别累计主买量 B(手)、主卖量 S(手)及主买额、主卖额（金额=成交价×成交量(手)×100，元）。净量 = B − S，净额 = 主买额 − 主卖额。0930方向：净量>0 填主买、<0 填主卖、=0 填平。0930净量(手)、0930净额(万元) 取绝对值。"], ["§3.6 0930七列——反向超越", "若 0930 为主卖，则在 09:31 之后的所有分钟桶里找主买净量；若 0930 为主买，则找主卖净量。只要存在任意一个分钟的反向净量 > 0930净量 即打✓。比较用的是净量（手）而非净额，净额只作参考同时输出。反向超越最大时点/净量/净额取反向净量最大的那一分钟（即使未超过0930也照常输出，便于看出差距）；全天没有反向分钟则时点填「-」、净量净额填 0。0930方向为「平」时★列留空、反向三列填「-」。"], ["§3.6 0930七列——取数结果", "筛选结果页 16 只 + 涨停页 46 只（2 只重叠），合计 60 只唯一个股的逐笔明细全部取数成功，失败 0 只。两个榜单复用同一个归约函数，重叠个股两页结果完全一致（已逐列核对 300852 四会富仕、002343 慈文传媒）。"], ["§3.6 0930校验①自洽性", "60 只全部满足：打✓的行「反向超越最大净量 > 0930净量」成立，留空的行不成立；且 0930净量 = |主买量 − 主卖量| 与方向符号一致。抽查 300006 莱美药业：主买 63,577 手、主卖 261,771 手、净量 −198,194 手 → 方向主卖、0930净量 198,194 手，一致。"], ["§3.6 0930校验②与腾讯分时比对", "逐笔算出的 0930桶总成交量（主买量+主卖量）与腾讯分时当日累计量精确对齐：300006 逐笔 325,348 手 = 腾讯 0931 快照累计 325,348 手；002343 逐笔 359,334 手 = 腾讯 0931 快照累计 359,334 手，两只均为零误差。说明：腾讯分时的标签是快照时刻，其首条「0930」(300006=89,771手、002343=110,744手)仅为 09:25 集合竞价的累计量，而「0931」快照才等于「集合竞价 + 09:30 整分钟」，正是本表 0930 桶的口径。两者精确相等同时证明了 09:25 集合竞价成交已被计入、且 09:15–09:24 的 bs=4 虚拟撮合量已被正确剔除（若误计入，该值会显著偏大）。"], ["主力资金流向", "东财 ulist.np 批量接口：f62=当日主力净额(元)、f184=当日净占比%、f164=近5日主力净额、f165=5日净占比%、f174=近10日主力净额、f100=东财行业板块。本次 16 只全部取到有效 f62，无需等待重试。校验 f184 ≈ f62÷f6：抽查5只（300006/300199/300852/301205/600825）逐只完全吻合。"], ["当日新进成交量前50榜", "取当日全市场成交量前500只（RANK500），用其上一交易日（2026-10-16）成交量算出上一交易日的前50名单；当日前50中不在上一交易日前50的即为「新进入」。本次新进 15 只，其中 3 只同时通过均线筛选（600825 新华传媒、601658 邮储银行、601816 京沪高铁）。"], ["量前50名次列", "进前50的直接写名次数字；未进前50但在全市场量前500以内的写实际名次并加括号（如 (87)，灰字）；前500以外填「-」。该列为全市场成交量口径。"], ["涨停池数据源", "push2ex getTopicZTPool（date=20261019）。字段：c=代码、n=名称、p=价格(×1000)、zdp=涨跌幅、amount=成交额、ltsz=流通市值、hs=换手率、lbc=连板数、zbc=当日炸板次数、fund=封板资金、hybk=行业板块。本次官方涨停池 46 只（tc=46）。"], ["行业板块列口径", "一律用东财 ulist/clist 的 f100；涨停池自带的 hybk 会被截断到4个字（如「房地产开」「计算机设」），仅作兜底。本次 46 只全部取到 f100，未使用 hybk 兜底，无「未分类」。"], ["涨停名单双重校验——方法", "用结构化方法独立复算：(1) 收盘价 == 当日最高价；(2) 收盘价精确等于涨停价 round(昨收×(1+r),2)，r 取板块候选集——主板[10%,5%]、创业板/科       rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
</script>
</body>
