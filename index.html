（444,854 手），低于第500名门槛，因此合并后的全市场成交量前500名全部来自沪深A股，RANK500 名单完整。创业板第400名成交额 2.60 亿元、科创板第300名成交额 1.57 亿元，均远低于B池 18 亿门槛，B池无遗漏。"], ["回退二：前3日主力净额", "push2his/fflow/daykline 不可用（域名不通，非限流）。按任务预定义的回退口径计算：前3日主力净额合计 = f164（近5日主力净额，含当日）− f62（当日主力净额），即 T-1 ~ T-4 四个交易日合计。涨停页「前3日区间」列统一标注为”回退口径:T-1~T-4(近5日扣当日)”，提示该列并非严格的 T-1~T-3 三日口径。"], ["回退三：0930 逐笔七列全部缺失", "东财当日逐笔明细 stock/details/get 持续 502，且该接口只保留最近一个交易日数据、无法隔日回溯，腾讯逐笔（stock.gtimg.cn）无 CORS 头亦不可用。因此两页的「0930方向 / 0930净量(手) / 0930净额(万元) / ★盘中反向超越 / 反向超越最大时点 / 反向超越最大净量(手) / 反向超越最大净额(万元)」七列对全部个股一律填 ”-”（★列留空），本次无任何个股取到逐笔数据（Sheet1 共 80 只、涨停页共 417 只，全部缺失）。这七列的定义仍保留如下行所述，待数据源恢复后即可正常产出。"], ["0930 七列的原定口径（本次无数据）", "数据源为东方财富当日逐笔成交明细的 bs 标志（1=主卖、2=主买、4=集合竞价）。规则：① 09:15:00–09:24:5x 的 bs=4 记录是集合竞价阶段的虚拟撮合参考量、不是成交，全部剔除；② 09:25:00 那一条是真正的集合竞价成交（bs 已为 1 或 2），计入 0930 桶；③ 0930 桶 = 09:25:00 一条 + 09:30:00–09:30:59 全部逐笔，其余逐笔按 HH:MM 各自归桶；④ 每桶累计主买量 B(手)、主卖量 S(手) 与对应金额（金额=成交价×手数×100），净量=B−S、净额=主买额−主卖额；⑤ 0930方向按净量符号取主买/主卖/平；⑥ ★盘中反向超越：若 0930 为主卖则在 09:31 之后各分钟找主买净量、若为主买则找主卖净量，存在任一分钟的反向净量大于 0930 净量即打 ✓（比较用净量(手)，净额仅作参考同时输出）。"], ["候选池 A池", "沪深京A股按成交量 f5 降序取前50名，且当日成交额 f6 > 10 亿元。本次前50名中 37 只达标入A池，13 只因成交额不足10亿被剔除（见 Sheet2）。"], ["候选池 B池", "创业板（m:0+t:80）+ 科创板（m:1+t:23）按成交额 f6 降序，取 f6 > 18 亿元的全部个股。本次 89 只。"], ["候选池合计", "A ∪ B = 122 只（A池37 + B池89，重叠4只）。"], ["均线条件（三条同时满足）", "① 最新收盘价 > MA5（近5个交易日收盘均值）；② 最新收盘价 > MA10（近10个交易日收盘均值）；③ 最新收盘价 > 5周线（按 ISO 周分组、取每周最后一个交易日的收盘价，再取最近5个周收盘的均值）。通过：122 → 80 只（主板14、创业板38、科创板28）。"], ["当日K线的统一重建", "日K取同花顺全历史前复权（d.10jqka.com.cn/v6/line/hs_{code}/01/all.js）。为避免盘中快照残留导致口径不一，一律丢弃同花顺的当日bar，再用东财当日行情重建一根：开盘 f17、最高 f15、最低 f16、收盘 f2、成交量 f5×100（手→股）。重建前逐只校验”同花顺去掉当日bar后的末根收盘价 ≈ 东财今日昨收 f18”。校验结果：Sheet1 80 只 + 涨停页 417 只全部通过（通过率 100%），且全部个股的同花顺序列末根日期均已是 2026-11-27、均被正确丢弃后重建。"], ["次新股保护", "日K不足10根或 ISO 周不足5个的个股会使 MA10/5周线分母虚低、造成假通过，一律排除出筛选结果。本次候选池中无此类个股（排除清单为空）。"], ["历史长度受限的个股", "300903 科翔股份：同花顺 all.js 返回 502，已回退用 last.js（仅含最近 140 个交易日、2026-05-07 起）。其 MA5/MA10/5周线/60日新高/25日换手率均在有效窗口内，但「★历史新高」「★年内新高」「距历史高点%」三项是基于 140 根样本计算的，口径受限，请勿按全历史理解（本次该股这三项均未命中）。 function build(s){

  const wrap = el('div','wrap'), tb = el('table');

  const isDesc = /说明/.test(s.name);

  s.cols.forEach((c,i)=>{

    const w = Math.max(56, Math.min(s.widths[i]||90, 420));

    th.onclick = ()=>sort(i, th);
    const ar = el('span','ar'); ar.textContent='⇅'; th.appendChild(ar);
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el('tbody'); if(isDesc) tbody.className='desc';
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  const numish = s.cols.map(c=>/%|额|价|MA|线|量|数|名次|市值|净|率|手|元/.test(c) && !/方向|时点|名称|板块|区间|报告期|股东|说明|代码|池/.test(c));
  let data = s.rows.map((r,i)=>({r, st:(s.cs&&s.cs[i])||[]}));
  let order = null, asc = true;

  function css(id){
    if(!id) return '';
    const st = s.styles[id-1]; if(!st) return '';
    let o = '';
    if(st.bg) o += 'background:'+st.bg+';';
    if(st.fc) o += 'color:'+st.fc+';';
    if(st.b) o += 'font-weight:700;';
    if(st.a==='center') o += 'text-align:center;';
    if(st.a==='right') o += 'text-align:right;';
    return o;
  }
  function render(){
    const q = inp.value.trim().toLowerCase();
    let rows = data;
    if(q) rows = rows.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(q)));
    if(order!==null){
      const k = order;
      rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
</script>
</body>
</html>
