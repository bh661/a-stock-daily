。距历史高点% = 收盘价 / 历史最高价 − 1。"], ["5周内单日换手>30%", "近25个交易日中任意一日：当日成交量(股) ÷ f39(流通股本) × 100 > 30。同时输出这25日的最大单日换手率。"], ["近5日分时单分钟>1亿", "数据源腾讯分时 day/query（num=5，返回倒序5天）。每条记录为“时间 价格 累计成交量 累计成交额”，逐条做差得到每分钟成交额，每天开盘把累计基准重置为0（故首条已含集合竞价金额，未跳过）。输出是否有超1亿的分钟、最大单分钟成交额、5日内超1亿的分钟数、最大分钟时点(MMDD-HHMM)。注：腾讯分时的分钟标签为“分钟末”标签，首条 0930 仅含集合竞价，0931 对应 09:30:00–09:30:59 这一分钟。"], ["§3.6 开盘0930主买/主卖（Sheet1 与涨停页共用同一函数）", "数据源：东方财富当日逐笔成交明细 stock/details/get（pos=-100000），记录格式“时间,成交价,成交量(手),笔数,bs”，bs：1=主卖、2=主买、4=集合竞价虚拟撮合。处理规则：(1) 09:15:00–09:24:5x 的 bs=4 记录为集合竞价阶段虚拟撮合量、不是成交，全部丢弃（本次共丢弃 6008 条）；(2) 集合竞价真实成交（bs 已为1或2）计入 0930 桶；(3) 09:30:00–09:30:59 的所有逐笔也计入 0930 桶；(4) 其余逐笔按 HH:MM 归入各自分钟桶。每桶累计主买量B(手)、主卖量S(手)及主买额、主卖额（金额=成交价×成交量(手)×100）。净量 = B − S，净额 = 主买额 − 主卖额。0930方向按净量符号。★盘中反向超越：0930为主卖则在09:31之后各分钟桶找主买净量、0930为主买则找主卖净量，只要任意一分钟的反向净量 > 0930净量即打✓；比较用净量(手)，净额仅作参考同时输出。该接口只保留最近一个交易日的数据，无法隔日回溯，故必须在当日运行时一次取完。"], ["§3.6 的一处口径修正（重要）", "集合竞价成交的时间戳并非总是精确的 09:25:00：成交活跃的大盘股常被打在 09:25:01 / 09:25:02（如 601398 工商银行为 09:25:01）。初版按 09:25:00 精确匹配导致 12只个股漏掉集合竞价量（与腾讯分时偏差 17%–37%）。已改为：09:25:00–09:29:59 之间的所有非 bs=4 记录一律计入 0930 桶。修正后全部 67只（候选28 + 涨停41，去重）的 0930桶总成交量与腾讯分时 0931 累计量吻合，最大相对偏差 0.06%、中位数 0%，集合竞价部分也与腾讯首条 0930 精确对上。"], ["§3.5 涨停股专页口径", "数据源 push2ex getTopicZTPool（date=20261027）。行业板块一律用东财 f100（hybk 会被截断到4个字，仅作兜底）。换手率：各日成交量(股) ÷ f39(流通股本) × 100，当日 + 前3个交易日分四列。★10日新高：当日最高价 ≥ 前10个交易日（不含当日）最高价。★高于MA5 / ★高于MA10 分两列并输出MA数值。前3日主力净额：push2his 同口径接口 fflow/daykline（取 T-1、T-2、T-3 三日 f52 求和，不含当日），实际取到的三个日期写在“前3日区间”列。★反包：昨日收盘价 < 前日收盘价 且 今日收盘价 > 昨日开盘价。"], ["★量前50 / 量前50名次 / ★成交额>20亿（全市场口径）", "这三列是全市场口径，与该股是否真的进入候选池无关，只要达标就打✓。★量前50：该股当日成交量 f5 是否进入全市场成交量前50（用当日全市场量前500名次表判断）。量前50名次：进前50写名次数字；未进前50但在前500以内写括号名次（如 (139)）；前500以外填 -。★成交额>20亿：当日成交额 f6 > 20亿元（一律以东财 clist/ulist 的 f6 为准，涨停池自带 amount 仅作兜底）。本次统计：★量前50 共 3只（002249 大洋电机 第33名、600715 文投控股 第18名、002724 海洋王 第45名）；★成交额>20亿 共 1只（002724 海洋王 20.90亿元）；两项同时满足 1只：002724 海洋王。"], ["涨停页排序规则", "按「行业板块」名称的拼音 A→Z 升序（由 JS 的 localeCompare(zh-Hans-CN) 生成），同一行业内再按成交额从大到小。不按板块分组，主板/创业板混排，板块只作为一列信息保留。行业为空的填「未分类」并排到最后（本次无）。以拉丁字母开头的行业名（如 IT服务Ⅱ）在该规则下会排在中文行业名之后，属正常现象（本次涨停页无此类行业）。相邻行业之间换行业的第一行上边框加粗，便于按行业分块阅读。"], ["前十大流通股东标注：分类函数与判断顺序", "Sheet1 与涨停页复用同一个分类函数，口径完全一致。数据源 RPT_F10_EH_FREEHOLDERS，取最新 END_DATE 的前10名。一个股东只归入最先命中的一类。第一步先排除境内合资公募/普通资管：名称含“证券投资基金/资产管理计划/集合资产管理/保险产品”，以及摩根基金、摩根士丹利基金、景顺长城、交银施罗德、国投瑞银、工银瑞信、招商安本、贝莱德基金、路博迈基金、富达基金、安联基金等境内合资公募，一律不算境外机构也不算国资（但“社保基金/养老保险基金”不在此排除之列）。第二步社保基金/养老金；第三步国家产业基金/国资平台（地方国资在名称后加 [地方]）；第四步 QFII/外资机构；第五步陆股通（香港中央结算有限公司 / (A股)）；第六步其他境外主体。单元格内容为“完整股东名(持流通股比例%)”，多个用「；」分隔，未命中留空。"], ["涨停页不含国资列", "涨停页只输出 ★QFII/外资机构、★陆股通(香港中央结算)、★其他境外主体、★社保基金/养老金 四列，★国家产业基金/国资平台 一列只保留在 Sheet1；但国资类在判断顺序里仍照常先命中先归类，以免国资主体被错误落进外资/其他境外三类。"], ["当日新进入成交量前50榜", "取当日全市场成交量前500只为样本，用腾讯 fqkline 按日期精确匹配上一交易日（2026-10-26）的成交量（数组第6个值，单位手）算出上一交易日前50名单；当日前50中不在上一交易日前50的即为“新进入”。候选池内已有同花顺日K的128只直接用其 volumn 兜底（除以100换成手），其余438只走腾讯，全部成功、0失败。当日全市场新进前50共 15只，其中进入 Sheet1 的 5只：601166 兴业银行、002724 海洋王、002181 粤传媒、601600 中国铝业、601169 北京银行。"], ["主力资金流向", "当日主力净额 f62 与当日净占比 f184 取自东财 ulist.np（全部 67只均非空，无需重试）。近5日/近10日主力净额与5日净占比由 fflow/daykline（lmt=15）的逐日 f52 聚合得出（见下方“技术回退”），5日净占比 = 5日净额 ÷ 5日成交额，其中各日成交额由 f52 ÷ (f57/100) 还原。"], ["Sheet1 各标注命中数（28只）", "历史新高 1只；年内新高 5只；60日新高 10只；5周内单日换手>30% 3只；近5日分时单分钟>1亿 19只；当日新进前50 5只。股东标注：★QFII/外资机构 3只、★陆股通 23只、★其他境外主体 12只、★社保基金/养老金 7只、★国家产业基金/国资平台 6只。资金方向：当日主力净流入 13只、净流出 15只。净流入最大：大洋电机 +5.05亿、兴业银行 +4.63亿、粤传媒 +3.83亿、光库科技 +2.84亿；净流出最大：天娱数科 −3.95亿、万向钱潮 −3.31亿、上纬新材 −3.12亿、迈瑞医疗 −2.17亿。"], ["Sheet1 的 0930 统计", "0930主买 17只、0930主卖 11只、平 0只。其中被盘中反向分钟超越：0930主买被反超 9只、0930主卖被反超 7只。0930主买且全天未被反向分钟超越（最强）8只：海洋王、中国铝业、北京银行、光库科技、网宿科技、汇川技术、绿的谐波、奥比中光-W。0930主卖但盘中被大额主买分钟反超（反转）7只：万向钱潮、民生银行、光大银行、长盈精密、慈星股份、宇树科技-W、中控技术。全部个股的「反向超越最大时点」均落在 15:00 及之前，无盘后固定价格交易干扰。"], ["涨停页各标注命中数（41只）", "板块分布：主板 36只、创业板 5只（无科创板/北交所）。覆盖行业 24个，只数最多：汽车零部件 8只、一般零售 6只、电机Ⅱ 3只、家电零部件Ⅱ 2只、通信设备 2只。连板梯队最高：上海九百 5板、襄阳轴承 4板、多伦科技 4板、赛福天 4板，其后为国脉科技/沪光股份等 2板。★10日新高 27只；★反包 14只（另一口径“昨日为阴线即昨收<昨开”命中 11只，作对照）；★高于MA5 41只、★高于MA10 40只；当日换手率>30% 1只。前3日资金：净流入 24只、净流出 17只。股东标注：★陆股通 21只、★QFII/外资机构 19只、★其他境外主体 6只、★社保基金/养老金 0只。"], ["涨停页的 0930 统计", "0930主买 24只、0930主卖 17只、平 0只。其中被盘中反向分钟超越：0930主买被反超 17只、0930主卖被反超 10只。"], ["涨停池定稿过程", "15:19 首次取到 42只，15:25 再取为 41只且名单有变，说明官方池此刻仍在更新。随后以约 25秒间隔连取 4次快照，4次名单完全一致（均为 41只）后才定稿。相对首次快照：新增 603028 赛福天，移除 600826 兰生股份、600865 百大集团。本表采用定稿后的 41只名单，并对新增个股 603028 补齐了日K、逐笔明细、行情字段、资金流与股东全部数据。"], ["涨停名单双重校验", "独立复算口径：收盘价 == 当日最高价，且收盘价精确等于 round(昨收×(1+r),2)，r 取该板块候选集（主板[10%,5%]、创业板/科创板[20%,5%]、北交所[30%,5%]）。复算样本取当日涨幅榜（clist 按 f3 降序）200只，覆盖到涨幅 2.62%，完整覆盖 5% 区间。复算得 44只，官方池 41只，官方池中无一只不在复算名单内（onlyOfficial = 0）。差异 3只（仅复算命中、官方池不收录）：603843 *ST正平（收盘 4.97 = 4.52×1.10，属 ST/风险警示股涨跌幅限制口径分歧——按板块常规10%算出的涨停价成立，但其实际限制为5%，官方池不收录）；600826 兰生股份（9.04 = 8.22×1.10）与 600865 百大集团（12.62 = 11.47×1.10），这两只在 15:19 的首次快照中曾出现、定稿快照中被官方池移除。按既定规则最终以官方涨停池为准，上述 3只不计入涨停页。"], ["逐笔明细取数情况", "需要 0930 标注的 67只（候选池通过均线 28只 + 涨停 41只，去重）全部取数成功，失败清单为空。bs 值全部为 1/2/4，无未知方向记录（unknown = 0）。"], ["无股东数据的个股", "688836 宇树科技-W（新上市，RPT_F10_EH_FREEHOLDERS 无记录），四/五个股东列留空、股东报告期填 -。其余 66只均取到股东数据。"], ["资金流历史区间滞后的个股", "301314 科瑞思的 fflow 序列有缺口，“前3日区间”显示为 2026-10-09~2026-10-26（而非 2026-10-22~2026-10-26），已如实保留，便于一眼看出滞后。其余 40只涨停股区间均为 2026-10-22~2026-10-26。"], ["技术回退（重要）", "本次运行中 push2.eastmoney.com / push2delay / 1.push2 / 7.push2 四个域名的 clist 在内置浏览器与 Chrome 扩展中全部 Failed to fetch（整域 push2 不可达），push2his.eastmoney.com 与 quote.eastmoney.com 同样不可达。经逐一探测，改用等价主机 push2test.eastmoney.com 承担 clist / ulist.np / stock/details/get / fflow/daykline 四类请求（已验证返回当日定稿数据：clist total=5926，f124 与北京日期一致，逐笔全天合计与 f5 吻合 ±0.05%，fflow 末日 f52 与 f62 完全一致）。push2ex.eastmoney.com（涨停池）与 datacenter-web.eastmoney.com（股东）本身可达，按原口径使用。另：push2test 的多日资金聚合字段 f164/f174/f267 均只回显当日 f62（未填充），故 Sheet1 的近5日/近10日主力净额与5日净占比改由 fflow/daykline 的逐日 f52 聚合得出，口径更精确（此为对原流程的口径变更，特此标注）。同花顺日K/周K与腾讯日K/周K/分时全程可用，未触发限流。"], ["交叉校验结果", "① 抽查 002354 天娱数科、601857 中国石油、300124 汇川技术三只，用腾讯 fqkline（day 与 week，qfq）独立复算 MA5/MA10/5周线/252日最高/60日最高，并用同花顺周K(/11/all.js)第三方复算5周线：三只个股全部指标与本表完全一致（如 300124：MA5 52.374 / MA10 51.188 / 5周线 51.800 / 252日高 83.55 / 60日高 65.50，三源一致）。② 主力净占比 ≈ 主力净额 ÷ 成交额：抽查6只全部 OK（偏差 <0.15个百分点）。③ 两页同时出现 function build(s){
  const box = el('div');
  const bar = el('div','bar');
  const inp = el('input'); inp.type='search'; inp.placeholder='搜索代码 / 名称 / 行业…';
  const cnt = el('span','n');
  bar.appendChild(inp); bar.appendChild(cnt); box.appendChild(bar);

  const wrap = el('div','wrap'), tb = el('table');
  const thead = el('thead'), htr = el('tr');
  const isDesc = /说明/.test(s.name);
  const frozen = isDesc ? 0 : 2;
  let left = 0;
  s.cols.forEach((c,i)=>{
    const th = el('th'); th.textContent = c;
    const w = Math.max(56, Math.min(s.widths[i]||90, 420));
    th.style.minWidth = w+'px'; th.style.width = w+'px';
    if(i<frozen){ th.className='f'+i; th.style.left = left+'px'; left += w; }
    th.onclick = ()=>sort(i, th);
    const ar = el('span','ar'); ar.textContent='⇅'; th.appendChild(ar);
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el('tbody'); if(isDesc) tbody.className='desc';
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  const numish = s.cols.map(c=>/%|额|价|MA|线|量|数|名次|市值|净|率|手|元/.test(c) && !/方向|时点|名称|板块|区间|报告期|股东|说明|代码|池/.test(c));
  let data = s.rows.map((r,i)=>({r, st:(s.cs&&s.cs[i])||[]}));
  let order = null, asc = true;

  function css(id){
    if(!id) return '';
    const st = s.styles[id-1]; if(!st) return '';
    let o = '';
    if(st.bg) o += 'background:'+st.bg+';';
    if(st.fc) o += 'color:'+st.fc+';';
    if(st.b) o += 'font-weight:700;';
    if(st.a==='center') o += 'text-align:center;';
    if(st.a==='right') o += 'text-align:right;';
    return o;
  }
  function render(){
    const q = inp.value.trim().toLowerCase();
    let rows = data;
    if(q) rows = rows.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(q)));
    if(order!==null){
      const k = order;
      rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
</script>
</body>
</html>
