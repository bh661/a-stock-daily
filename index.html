同时出现的 6 只个股（000530/601099/002172/000410/300182/300413）对得上。\n⑥ ★量前50 自洽：6 只跨页个股中，筛选结果页名次≤50 的，涨停页★量前50 均为✓，无不一致。抽查 000530（名次36，f5=2,202,096手）与 000410（名次42，f5=2,081,056手），均大于全市场第50名的 1,903,535手。\n⑦ ★成交额>20亿 边界抽查：300182 为 22.06亿 → ✓；300413 为 19.66亿 → 空；000530 为 18.05亿 → 空；300085 为 17.93亿 → 空，比较正确。\n⑧ 股东标注抽查：601398 命中「全国社会保障基金理事会」→社保类、「中央汇金投资有限责任公司/中国证券金融股份有限公司/中央汇金资产管理有限责任公司」→国资类；601288 同理；000995 命中「UBS AG / MERRILL LYNCH INTERNATIONAL」→外资；301052 命中「BARCLAYS BANK PLC / 高盛国际-自有资金」→外资。未见境内合资公募被误标为外资，未见商业保险产品被误标为社保，未见普通国企被误标为国家产业基金。跨页 6 只个股两页股东标注完全一致（证明分类函数确实复用）。\n⑨ 0930 标注校验：601398 0930桶 主买173,732手 / 主卖73,604手 → 净量100,128手，方向主买，与表中一致。与腾讯分时的交叉核对——腾讯首条0930为集合竞价、第二条0931的累计量才等于「集合竞价+09:30整分钟」：601398 逐笔0930桶总量247,336手 = 腾讯0931累计247,336手；000410 为 235,874 = 235,874；688322 为 5,687手 = 568,721股/100，三只全部精确吻合，确认既未漏掉09:25集合竞价、也未误计09:15–09:24的虚拟撮合量。\n⑩ 跨页 6 只个股 0930 七列完全一致。\n⑪ ★盘中反向超越与数值自洽：两页全部 53 条有效记录中，打✓的均满足「反向超越最大净量 > 0930净量」，留空的均不满足，违例 0 条。"], ["本次运行的技术回退", "① push2 clist 在抓完候选池与 RANK500 后进入限流，后续「当日涨幅榜反向复算涨停名单」未能执行。\n② push2his fflow/daykline 限流，涨停页 88 只改用 f164−f62 回退口径（见上）。\n③ push2 stock/details/get 限流，涨停页 104 只 0930 七列缺失（见上）。\n④ 腾讯 fqkline 限流，交叉校验改用同花顺周K + 腾讯分时还原（见上）。\n⑤ 同花顺 all.js、腾讯 day/query、push2ex 涨停池、push2 ulist.np、datacenter-web 股东接口全程正常。\n⑥ push2 与 push2delay 两个域名在被限流的端点上表现一致（同为 Failed to fetch），本次未发生「push2 不可用而 push2delay 可用」的情形，故未切换回退域名。"], ["数据来源", "东方财富（行情 clist / ulist、涨停池 push2ex、资金流 push2his、逐笔明细 details、F10 前十大流通股东 datacenter-web）、同花顺（前复权日K/周K d.10jqka.com.cn）、腾讯财经（分时 day/query、日K fqkline）。"], ["免责声明", "本表为收盘快报版，大宗交易与龙虎榜数据当日18:00后才发布，见同日18:00的完整版报表。本表仅为按规则的数据筛选结果，不构成投资建议。"]], "cs": [[1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2], [1, 2]], "styles": [{"bg": null, "fc": null, "b": true, "a": "left"}, {"bg": null, "fc": null, "b": false, "a": "left"}], "widths": [409, 1267]}], "xlsx": true};
const el = (t,c)=>{const e=document.createElement(t); if(c) e.className=c; return e;};

const body = document.getElementById('body'), nav = document.getElementById('nav');

}else{

    return p;
  });
  function show(i){
    panes.forEach((p,j)=>p.style.display = i===j?'':'none');
    [...nav.children].forEach((b,j)=>b.classList.toggle('on', i===j));

function build(s){
  const box = el('div');
  const bar = el('div','bar');
  const inp = el('input'); inp.type='search'; inp.placeholder='搜索代码 / 名称 / 行业…';
  const cnt = el('span','n');
  bar.appendChild(inp); bar.appendChild(cnt); box.appendChild(bar);

  const wrap = el('div','wrap'), tb = el('table');
  const thead = el('thead'), htr = el('tr');
  const isDesc = /说明/.test(s.name);
  const frozen = isDesc ? 0 : 2;
  let left = 0;
  s.cols.forEach((c,i)=>{
    const th = el('th'); th.textContent = c;
    const w = Math.max(56, Math.min(s.widths[i]||90, 420));
    th.style.minWidth = w+'px'; th.style.width = w+'px';
    if(i<frozen){ th.className='f'+i; th.style.left = left+'px'; left += w; }
    th.onclick = ()=>sort(i, th);
    const ar = el('span','ar'); ar.textContent='⇅'; th.appendChild(ar);
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el('tbody'); if(isDesc) tbody.className='desc';
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  const numish = s.cols.map(c=>/%|额|价|MA|线|量|数|名次|市值|净|率|手|元/.test(c) && !/方向|时点|名称|板块|区间|报告期|股东|说明|代码|池/.test(c));
  let data = s.rows.map((r,i)=>({r, st:(s.cs&&s.cs[i])||[]}));
  let order = null, asc = true;

  function css(id){
    if(!id) return '';
    const st = s.styles[id-1]; if(!st) return '';
    let o = '';
    if(st.bg) o += 'background:'+st.bg+';';
    if(st.fc) o += 'color:'+st.fc+';';
    if(st.b) o += 'font-weight:700;';
    if(st.a==='center') o += 'text-align:center;';
    if(st.a==='right') o += 'text-align:right;';
    return o;
  }
  function render(){
    const q = inp.value.trim().toLowerCase();
    let rows = data;
    if(q) rows = rows.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(q)));
    if(order!==null){
      const k = order;
      rows = rows.slice().sort((a,b)=>{
        const x=a.r[k]??'', y=b.r[k]??'';
        const nx=parseFloat(String(x).replace(/,/g,'')), ny=parseFloat(String(y).replace(/,/g,''));
        const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
        let c = bothNum ? nx-ny : String(x).localeCompare(String(y),'zh-Hans-CN');
        return asc ? c : -c;
      });
    }
    tbody.textContent='';
    const frag = document.createDocumentFragment();
    rows.forEach(o=>{
      const tr = el('tr'); let l = 0;
      o.r.forEach((v,i)=>{
        const td = el('td');
        td.textContent = v;
        let cls = '';
        if(i<frozen){ cls='f'+i; const w=Math.max(56,Math.min(s.widths[i]||90,420)); td.style.left=l+'px'; l+=w; }
        if(numish[i]) cls += (cls?' ':'')+'num';
        if(v==='✓') cls += (cls?' ':'')+'ctr';
        if(cls) td.className = cls;
        const st = css(o.st[i]);
        if(st) td.style.cssText += st;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    cnt.textContent = rows.length + ' / ' + data.length + ' 行';
  }
  function sort(i, th){
    if(order===i) asc = !asc; else { order = i; asc = true; }
    [...htr.children].forEach(h=>h.querySelector('.ar').textContent='⇅');
    th.querySelector('.ar').textContent = asc?'▲':'▼';
    render();
  }
  inp.oninput = render;
  render();
  return box;
}
